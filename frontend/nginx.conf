server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Encaminha chamadas de API para o serviço de backend dentro da rede
    # interna do Docker Compose. O frontend chama sempre um caminho
    # relativo ("/api/..."), então o navegador nunca precisa saber o
    # endereço do contêiner do backend (que só existe dentro da rede
    # Docker e não é resolvido pelo navegador do usuário).
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
